name: Tests and package

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cloud-startup:
    name: Community Cloud installation and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Cloud dependency selection
        run: test ! -f uv.lock
      - name: Install Cloud dependencies with legacy uv
        run: |
          python -m pip install uv==0.4.30
          uv pip install --system -r requirements.txt
      - name: Verify Streamlit startup
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py").run(timeout=30)
          assert not app.exception, app.exception
          assert app.text_input(key="quick_c_url").label == "M3U Bağlantısı:"
          PY

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and development tools
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: python -m ruff check app.py bootstrap.py setup.py src utils ui static tests
      - name: Offline unit and integration tests
        run: python -m pytest
      - name: Build wheel
        run: python -m build --wheel
