name: Tests and package

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and development tools
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: python -m ruff check app.py bootstrap.py setup.py src utils ui static tests
      - name: Offline unit and integration tests
        run: python -m pytest
      - name: Build wheel
        run: python -m build --wheel
